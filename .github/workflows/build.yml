name: Build and SEO checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Verify new federal tax calculator output
        run: |
          test -f dist/us-federal-take-home-pay-calculator/index.html
          grep -q "Social Security" dist/us-federal-take-home-pay-calculator/index.html
          grep -q "canonical" dist/us-federal-take-home-pay-calculator/index.html
      - name: Verify generated SEO pages
        run: node scripts/check-seo.mjs
      - name: Verify calculator and wage data
        run: node --test tests/*.test.js
      - name: Run mobile Lighthouse audits on target hourly pages
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/30-an-hour-is-how-much-a-year/ > /dev/null; then break; fi
            sleep 1
          done
          npx --yes lighthouse@12 http://127.0.0.1:4321/20-an-hour-is-how-much-a-year/ --chrome-flags="--headless --no-sandbox" --preset=desktop --output=json --output-path=/tmp/lh-20.json --quiet
          npx --yes lighthouse@12 http://127.0.0.1:4321/30-an-hour-is-how-much-a-year/ --chrome-flags="--headless --no-sandbox" --form-factor=mobile --screenEmulation.mobile=true --screenEmulation.width=375 --screenEmulation.height=812 --screenEmulation.deviceScaleFactor=1 --output=json --output-path=/tmp/lh-30-mobile.json --quiet
          node scripts/check-lighthouse.mjs /tmp/lh-20.json /tmp/lh-30-mobile.json
      - name: Upload Lighthouse audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-lighthouse-reports
          path: /tmp/lh-*.json
          if-no-files-found: ignore
