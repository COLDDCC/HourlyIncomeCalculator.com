name: Build and SEO checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        run: npm run build
      - name: Verify new federal tax calculator output
        run: |
          test -f dist/us-federal-take-home-pay-calculator/index.html
          grep -q "Social Security" dist/us-federal-take-home-pay-calculator/index.html
          grep -q "canonical" dist/us-federal-take-home-pay-calculator/index.html
      - name: Verify generated SEO pages
        run: node scripts/check-seo.mjs
      - name: Verify calculator and wage data
        run: node --test tests/*.test.js
